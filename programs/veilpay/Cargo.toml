[package]
name = "veilpay"
version = "0.1.0"
description = "Confidential programmable stablecoin payments on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veilpay"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["idl-build"] }
inco-lightning = { version = "0.1.4", features = ["cpi"] }

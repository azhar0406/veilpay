<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Outer sun rays -->
  <g stroke="url(#rayGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="52" x2="256" y2="16"/>
    <line x1="256" y1="496" x2="256" y2="460"/>
    <line x1="52" y1="256" x2="16" y2="256"/>
    <line x1="496" y1="256" x2="460" y2="256"/>
    <line x1="112" y1="112" x2="86" y2="86"/>
    <line x1="400" y1="400" x2="426" y2="426"/>
    <line x1="400" y1="112" x2="426" y2="86"/>
    <line x1="112" y1="400" x2="86" y2="426"/>
    <line x1="176" y1="72" x2="162" y2="38"/>
    <line x1="336" y1="72" x2="350" y2="38"/>
    <line x1="176" y1="440" x2="162" y2="474"/>
    <line x1="336" y1="440" x2="350" y2="474"/>
    <line x1="72" y1="176" x2="38" y2="162"/>
    <line x1="72" y1="336" x2="38" y2="350"/>
    <line x1="440" y1="176" x2="474" y2="162"/>
    <line x1="440" y1="336" x2="474" y2="350"/>
  </g>

  <!-- Sun circle — muted warm glow -->
  <circle cx="256" cy="256" r="148" fill="url(#sunGrad)" opacity="0.08"/>
  <circle cx="256" cy="256" r="148" stroke="url(#sunGrad)" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="120" stroke="url(#sunGrad)" stroke-width="1.5" fill="none" opacity="0.25"/>

  <!-- Lock body -->
  <rect x="212" y="262" width="88" height="72" rx="12" fill="url(#lockGrad)" stroke="url(#sunGrad)" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Lock shackle -->
  <path d="M232 262 V234 C232 210 280 210 280 234 V262" fill="none" stroke="url(#sunGrad)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Keyhole -->
  <circle cx="256" cy="290" r="9" fill="url(#sunGrad)" opacity="0.8"/>
  <rect x="253.5" y="296" width="5" height="16" rx="2.5" fill="url(#sunGrad)" opacity="0.8"/>

  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
</svg>
